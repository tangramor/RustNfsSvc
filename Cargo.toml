[package]
name = "rustnfssvc"
version = "0.1.0"
edition = "2021"
authors = ["tangramor"]
description = "A high-performance NFSv3/v4.1 server for Windows, written in Rust"
license = "GPL-3.0"
readme = "README.md"
keywords = ["nfs", "nfs4", "windows", "service", "file-server"]
categories = ["filesystem", "network-programming"]
exclude = ["install.bat", "uninstall.bat"]

[[bin]]
name = "rustnfssvc"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Network
tokio-util = { version = "0.7", features = ["codec"] }

# Time handling
chrono = "0.4"

# Cross-platform path handling
path-clean = "1.0"

# Network utilities
ipnet = { version = "2.9", features = ["serde"] }

# Ctrl-C / signal handling (used by service mode)
ctrlc = "3.4"

# Windows Service support
windows-service = "0.6"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
